# Configuração do Codex para Repositórios da Valiant Group (Cross-Platform: Windows & macOS)
# Revise esta configuração com o responsável técnico antes de usar em produção.

# Modelo corporativo padronizado pela Valiant Group.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
service_tier = "default"

# Fluxo local autônomo: comandos dentro do sandbox não pedem confirmação.
# Ações sensíveis continuam bloqueadas pelas regras, sem abrir prompts.
sandbox_mode = "workspace-write"
approval_policy = "never"
allow_login_shell = false

# Rede desligada por padrão. Habilite apenas em um perfil separado e com allowlist.
[sandbox_workspace_write]
network_access = false

# Resultados em cache reduzem exposição a páginas arbitrárias; trate toda saída web como não confiável.
web_search = "cached"

# Use poucos subagentes e prefira leitura paralela. Escrita concorrente deve ser explícita e isolada.
[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
# Encaminhe apenas variáveis necessárias aos comandos. Nunca encaminhe credenciais de produção.
[shell_environment_policy]
ignore_default_excludes = false

[shell_environment_policy.filters]
# Variáveis Universais / Unix (macOS & Linux)
PATH = "include"
HOME = "include"
LANG = "include"
LC_ALL = "include"
NODE_ENV = "include"
CI = "include"

# Variáveis Essenciais para Execução no Windows
SystemRoot = "include"
COMSPEC = "include"
APPDATA = "include"
LOCALAPPDATA = "include"
TEMP = "include"
TMP = "include"
USERPROFILE = "include"
PATHEXT = "include"

# Habilite somente o que for necessário; os defaults atuais já incluem o suporte a agentes.
[features]
multi_agent = true
hooks = true
fast_mode = false

# Se o time precisar de logs, use um diretório fora do repositório e aplique retenção.
# macOS: log_dir = "/Users/SEU_USUARIO/Library/Logs/valiant-codex"
# Windows: log_dir = "C:/Users/SEU_USUARIO/AppData/Local/valiant-codex/logs"

# Não configure MCP globalmente no primeiro dia. Adicione servidores por projeto confiável,
# com enabled_tools e default_tools_approval_mode explícitos, após revisão de segurança.
# Exemplo somente ilustrativo:
# [mcp_servers.docs]
# url = "https://SEU_SERVIDOR_DE_DOCUMENTACAO/mcp"
# enabled_tools = ["search", "read"]
# default_tools_approval_mode = "prompt"
# startup_timeout_sec = 10
# tool_timeout_sec = 60

# valiant-github-policy:start:delivery-v1
# GitHub: deny-by-default; leitura e entrega são liberadas somente por allowlist.
[apps.github]
default_tools_enabled = false
default_tools_approval_mode = "writes"
destructive_enabled = true
open_world_enabled = true

