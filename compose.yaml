name: pricing-intel

x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-pricing_intel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}@postgres:5432/${POSTGRES_DB:-pricing_intel}
  ENVIRONMENT: local
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LAB_STORE_A_BASE_URL: http://lab-store-a:8000
  LAB_STORE_B_BASE_URL: http://lab-store-b:8000

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  environment: *app-environment
  init: true
  restart: unless-stopped
  networks:
    - application

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pricing_intel}
      POSTGRES_USER: ${POSTGRES_USER:-pricing_intel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-pricing_intel} -d ${POSTGRES_DB:-pricing_intel}
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - application

  migrate:
    <<: *app-service
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        python scripts/apply_jobs_schema.py &&
        python scripts/seed_catalog.py
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    environment:
      <<: *app-environment
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
    command:
      - uvicorn
      - pricing_intel.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    ports:
      - 127.0.0.1:${API_PORT:-8000}:8000

  worker:
    <<: *app-service
    build:
      context: .
      dockerfile: Dockerfile
      target: browser-runtime
    command:
      - procrastinate
      - -a
      - pricing_intel.jobs.app.app
      - worker
      - --queues
      - collection
      - --concurrency
      - "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      lab-store-a:
        condition: service_healthy
      lab-store-b:
        condition: service_healthy
    mem_limit: 1024m
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - application
      - laboratory

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test-runtime
    environment:
      <<: *app-environment
      API_BASE_URL: http://api:8000
    command:
      - pytest
    depends_on:
      api:
        condition: service_healthy
    init: true
    profiles:
      - test
    restart: "no"
    networks:
      - application

  lab-store-a:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command:
      - uvicorn
      - lab.sources.store_a.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      ENVIRONMENT: laboratory
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/categoria/smartphones', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    mem_limit: 192m
    restart: unless-stopped
    networks:
      - laboratory

  lab-store-b:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command:
      - uvicorn
      - lab.sources.store_b.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      ENVIRONMENT: laboratory
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/c/celulares', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    mem_limit: 192m
    restart: unless-stopped
    networks:
      - laboratory

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    mem_limit: 128m
    restart: unless-stopped
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-3000}:80
    networks:
      - application

volumes:
  postgres-data:

networks:
  application:
  laboratory:
    internal: true
