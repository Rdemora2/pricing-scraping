name: Governance

on:
  pull_request:
  push:
    branches: [main, master]

permissions: {}

concurrency:
  group: governance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout governed history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate governance contracts
        run: python3 -m unittest discover -s .codex/tests -p 'test_*.py'

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/check_commit_policy.py
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
